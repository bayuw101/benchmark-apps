# Guardrails for the runner namespaces perf-staging and perf-prod (same names as on EKS).
# Same documents for both namespaces; keep the two halves identical apart from `namespace`.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: perf-quota
  namespace: perf-staging
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
# Defaults so operator-created pods (initializer/starter) without resources are not rejected by the quota.
apiVersion: v1
kind: LimitRange
metadata:
  name: perf-defaults
  namespace: perf-staging
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
# Default-deny egress; only DNS, same-namespace (starter -> runner :6565), Prometheus remote-write and approved targets are allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-egress
  namespace: perf-staging
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: targets
          podSelector:
            matchLabels:
              btb.io/approved-target: "true"
      ports:
        - protocol: TCP
          port: 3000
---
